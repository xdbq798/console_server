# 通过 bash scripts/start.sh pre/prod --docker 启动，统一加载环境和端口。
services:
  # 缓存 / token 黑名单（仅 compose 内部网络访问，不映射宿主机端口）
  redis:
    image: redis:7-alpine
    # REDIS_PASSWORD 必须在部署 env 文件（.env.prod / .env.pre）中设置；AOF 开启保证重启不丢数据
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?请在部署 env 文件中设置 REDIS_PASSWORD}"]
    environment:
      # 供 healthcheck 内部引用（$$REDIS_PASSWORD）
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      # 按环境隔离数据目录（.env.prod / .env.pre 已定义 ENV=prod / pre）
      - ~/redis-${ENV:-prod}-data:/data
    healthcheck:
      # $$ 转义为容器内环境变量，避免密码落入插值后的检查命令
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  backend:
    image: ${CONSOLE_IMAGE:-console-server:local}
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: ${CONSOLE_ENV_FILE:-.env.${ENV:?请通过 scripts/start.sh 环境 --docker 启动}}
        required: false
    environment:
      - ENV
      - HOST
      - PORT
      - DEBUG
      - RELOAD
      - WORKERS
      - LOG_LEVEL
      - FORWARDED_ALLOW_IPS
      - DATABASE_URL
      - SECRET_KEY
      - DEEPSEEK_API_KEY
      - DEEPSEEK_BASE_URL
      - DEEPSEEK_MODEL
      - DEEPSEEK_MAX_TOKENS
      - DEEPSEEK_READ_TIMEOUT_SECONDS
      - CHAT_STREAM_TIMEOUT_SECONDS
      - COOKIE_SECURE
      - AUTH_ALLOWED_ORIGINS
      - APP_VERSION
      - API_STR
      - ALGORITHM
      - ACCESS_TOKEN_EXPIRE_MINUTES
      - REFRESH_TOKEN_EXPIRE_DAY
      - TOKEN_TYPE
      - CLEANUP_EXPIRED_TOKENS_INTERVAL_HOURS
      - DEFAULT_PAGE_SIZE
      - MAX_PAGE_SIZE
      - CORS_ALLOW_ORIGIN
      - GLOBAL_LOG_LEVEL
      - CONFIG_LOG_LEVEL
      - DB_LOG_LEVEL
      - MAIN_LOG_LEVEL
      - SOCKET_LOG_LEVEL
      - OAUTH_LOG_LEVEL
      - REDIS_URL
      - REDIS_SENTINEL_HOSTS
      - REDIS_SENTINEL_PORT
      - ENABLE_WEBSOCKET_SUPPORT
      - WEBSOCKET_MANAGER
      - WEBSOCKET_REDIS_URL
      - WEBSOCKET_REDIS_LOCK_TIMEOUT
      - WEBSOCKET_SENTINEL_HOSTS
      - WEBSOCKET_SENTINEL_PORT
    depends_on:
      # Redis 未就绪前不启动 backend；连接失败时代码仍会降级为数据库路径
      redis:
        condition: service_healthy
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HOST_PORT:-${PORT:?PORT 未设置，请通过 scripts/start.sh 环境 --docker 启动}}:${PORT:?PORT 未设置}"
    restart: unless-stopped
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
